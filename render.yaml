services:
  - type: web
    name: strikehub
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      # Se fuerza explícitamente la versión de Python: el archivo
      # .python-version no siempre se respeta en Render (en su momento usó
      # 3.14 por defecto y rompió psycopg2-binary por un cambio de ABI).
      # Ahora se fija la misma versión que se usa en desarrollo (3.14.x).
      # El bloqueo anterior con 3.14 venía de pydantic-core, que no tenía
      # rueda para esa versión y trataba de compilar Rust; con pydantic
      # 2.14.1 (pydantic-core 2.50.1) y psycopg2-binary 2.9.12 ya hay
      # ruedas cp314 y no se compila nada. PYTHON_VERSION exige la versión
      # completa (mayor.menor.parche).
      - key: PYTHON_VERSION
        value: 3.14.9
      # Secretos: se pegan manualmente en el Dashboard de Render (Environment),
      # nunca se escriben aquí ni se suben al repositorio.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
